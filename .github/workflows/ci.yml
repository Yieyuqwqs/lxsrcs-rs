name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        id: build
        run: |
          set +e
          cargo build --all-targets > /tmp/build.log 2>&1
          code=$?
          tail -c 12000 /tmp/build.log
          cp /tmp/build.log build-error.log
          exit $code

      - name: Test
        if: steps.build.outcome == 'success'
        run: cargo test 2>&1 | tail -60

      - name: 把编译错误提交回仓库（失败时才有内容）
        if: failure()
        run: |
          if [ -s build-error.log ]; then
            git config user.email "ci@local"
            git config user.name "ci"
            git add -f build-error.log
            git commit -m "ci: build error snapshot" || true
            git push || true
          fi

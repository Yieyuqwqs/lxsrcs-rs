[package]
name = "lxsrcs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "LX-Source 的 Rust 实现：洛雪音乐自定义源服务端（与 Go 版 /api/v0 线格式兼容）"
license = "MIT"
autobins = false

[[bin]]
name = "lxsrcs"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "http2"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

aes = "0.8"
cipher = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
md5 = "0.7"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
flate2 = "1"
rand = "0.8"

once_cell = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
